<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Console</title>
<style>
  :root { --crimson:#B11226; --ember:#E2401B; --ink:#171717; --muted:#6B6B6B; --line:#E6E3E1; --ok:#1a7f37; --paper:#faf9f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:var(--paper); }
  header { display:flex; align-items:center; gap:12px; padding:14px 22px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .mark { width:32px; height:32px; background:var(--crimson); color:#fff; font-weight:700; display:grid; place-items:center; }
  .checks { margin-left:auto; display:flex; gap:6px; }
  .chk { font-size:11px; padding:3px 8px; border:1px solid var(--line); }
  .chk.ok { color:var(--ok); border-color:var(--ok); } .chk.bad { color:var(--crimson); border-color:var(--crimson); }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr; gap:16px; }
  .tabs { display:flex; gap:6px; }
  .tab { padding:8px 14px; border:1px solid var(--line); background:#fff; cursor:pointer; font-weight:600; font-size:14px; }
  .tab.active { background:var(--ink); color:#fff; }
  .card { background:#fff; border:1px solid var(--line); padding:0; }
  .req { border-left:5px solid var(--crimson); padding:16px 18px; border-bottom:1px solid var(--line); }
  .req.handled { border-left-color:var(--muted); opacity:.6; }
  .req h3 { margin:0 0 4px; font-size:18px; }
  .msg { background:#fdeaec; border:1px solid #f3c9cf; padding:10px 12px; margin:8px 0; font-size:15px; }
  .profile { display:grid; grid-template-columns:repeat(2,1fr); gap:4px 18px; font-size:13px; margin:8px 0; }
  .profile div span { color:var(--muted); }
  .loc { font-weight:600; }
  .zipbar { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  input, textarea { font-size:14px; padding:8px; border:1px solid var(--line); border-bottom:2px solid var(--ink); font-family:inherit; }
  button { padding:8px 14px; font-weight:600; color:#fff; background:var(--crimson); border:0; cursor:pointer; font-size:13px; }
  button.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .dispatch-hit { font-size:20px; font-weight:700; color:var(--ink); }
  .row { display:flex; justify-content:space-between; padding:8px 14px; border-bottom:1px solid var(--line); font-size:14px; align-items:center; gap:8px; }
  .muted { color:var(--muted); font-size:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0; padding:12px 16px; border-bottom:1px solid var(--line); }
  a { color:var(--crimson); }
  .empty { padding:20px; color:var(--muted); }
  .thread { display:flex; flex-direction:column; gap:5px; margin:10px 0; max-height:260px; overflow-y:auto; padding:6px; background:#fafafa; border:1px solid var(--line); }
  .bub { max-width:78%; padding:7px 11px; border-radius:12px; font-size:13px; line-height:1.35; }
  .bub.in { align-self:flex-start; background:#fdeaec; }
  .bub.out { align-self:flex-end; background:#e6f4ea; }
  .bub .bt { display:block; font-size:10px; color:var(--muted); margin-top:3px; }
  .sendbar { display:flex; gap:8px; margin:8px 0; }
  .sendbar input { flex:1; }
</style>
</head>
<body>
<header><div class="mark">A</div><strong id="svc">Argus</strong> <span class="muted">argus-team console</span>
  <div class="checks" id="checks"></div>
</header>
<datalist id="fmfriends"></datalist>
<main>
  <div class="tabs">
    <div class="tab active" data-t="help">Help requests</div>
    <div class="tab" data-t="feed">Live feed</div>
    <div class="tab" data-t="people">Victims</div>
    <div class="tab" data-t="dispatch">Dispatch numbers</div>
  </div>
  <div id="view-help"></div>
  <div id="view-feed" hidden></div>
  <div id="view-people" hidden></div>
  <div id="view-dispatch" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const token = new URLSearchParams(location.search).get("token") || "";
const H = token ? { Authorization: "Bearer " + token } : {};
async function api(path, body) {
  const opt = { headers: { ...H } };
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j;
}
let tab = "help";
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  tab = t.dataset.t;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  ["help","feed","people","dispatch"].forEach(v => $("view-"+v).hidden = v !== tab);
  render();
});

async function status() {
  try {
    const d = await api("/api/status");
    $("svc").textContent = d.serviceName;
    const C = [["ollama","Ollama"],["model","Model"],["messages","Messages"],["findMy","Find My"]];
    $("checks").innerHTML = C.map(([k,l]) => `<span class="chk ${d.readiness[k]?"ok":"bad"}">${d.readiness[k]?"OK":"!"} ${l}</span>`).join("");
    if (d.findMy && d.findMy.friends) $("fmfriends").innerHTML = d.findMy.friends.map(f => `<option value="${esc(f.name)}">${esc(f.place)}</option>`).join("");
  } catch (e) { $("checks").innerHTML = `<span class="chk bad">offline: ${esc(e.message)}</span>`; }
}

function profileHtml(p) {
  if (!p) return '<div class="muted">No profile - not registered.</div>';
  const f = (label, v) => v ? `<div><span>${label}:</span> ${esc(v)}</div>` : "";
  return `<div class="profile">${f("Name",p.name)}${f("Medical",p.medical)}${f("Allergies",p.allergies)}${f("Medications",p.medications)}${f("Emergency contact",p.emergency_contact)}${f("Find My name",p.findmy_name)}</div>${p.notes?`<div class="muted">${esc(p.notes)}</div>`:""}`;
}

function renderCands(node, list, zip) {
  const box = node.querySelector(".cands");
  if (!box) return;
  if (!list || !list.length) { box.innerHTML = '<div class="muted">No police numbers found in open data near ' + esc(zip) + '. Call 911.</div>'; return; }
  box.innerHTML = list.map(c => `<div class="row"><span><b>${esc(c.agency)}</b> &middot; <b>${esc(c.phone)}</b> <span class="muted">${esc(c.address||'')} &middot; ${c.distanceKm.toFixed(1)} km</span></span><button class="usec sec" data-ph="${esc(c.phone)}" data-ag="${esc(c.agency)}">use</button></div>`).join("");
  box.querySelectorAll(".usec").forEach(b => b.onclick = async () => { node.querySelector(".dnum").value = b.dataset.ph; await api("/api/dispatch", { zip, agency: b.dataset.ag, phone: b.dataset.ph }).catch(()=>{}); });
}
async function renderHelp() {
  const ae = document.activeElement;
  if (ae && (ae.classList.contains("opmsg") || ae.classList.contains("zip") || ae.classList.contains("dnum") || ae.classList.contains("lnote") || ae.classList.contains("fmname"))) return; // don't interrupt typing
  const d = await api("/api/help");
  const el = $("view-help");
  if (!d.requests.length) { el.innerHTML = '<div class="card"><div class="empty">No help requests. When a registered victim texts for help, it appears here.</div></div>'; return; }
  el.innerHTML = '<div class="card">' + d.requests.map(r => {
    const p = r.person;
    const addr = r.address ? `<span class="loc">${esc(r.address.address)}</span> &middot; <a href="${esc(r.address.mapsUrl)}" target="_blank" rel="noopener">map</a>` : "";
    const loc = r.findMyLocation ? `Find My: ${addr || '<span class="loc">'+esc(r.findMyLocation)+'</span>'}${addr?` <span class="muted">near ${esc(r.findMyLocation)}</span>`:''}` : (p?.findmy_name ? `Find My name set (${esc(p.findmy_name)}) - click Rescan` : "No Find My mapping");
    return `<div class="req ${r.status==='handled'?'handled':''}" data-id="${r.id}" data-phone="${esc(r.phone)}">
      <h3>${esc(p?.name || r.phone)} <span class="muted">${esc(r.phone)} &middot; ${new Date(r.at).toLocaleTimeString()}</span></h3>
      <div class="msg">${esc(r.text)}</div>
      ${profileHtml(p)}
      <div class="thread">${((r.messages||[]).slice().reverse()).map(m => `<div class="bub ${m.direction}">${esc(m.text)}<span class="bt">${m.direction==='in'?'them':(m.kind==='operator'?'you':'auto')} · ${new Date(m.at).toLocaleTimeString()}</span></div>`).join("") || '<div class="muted" style="padding:6px">No messages yet.</div>'}</div>
      <div class="sendbar"><input class="opmsg" placeholder="Message ${esc(p?.name || r.phone)}…"><button class="opsend">Send</button></div>
      <div style="margin:6px 0">${loc} &middot; <a href="#" class="rescan">rescan Find My</a></div>
      <div class="zipbar"><span class="muted">Find My name:</span>
        <input class="fmname" list="fmfriends" placeholder="e.g. Lysander Elgar" value="${esc(p?.findmy_name||'')}" size="18">
        <button class="sec fmset">Set &amp; locate</button>
      </div>
      <div class="zipbar">
        <span class="muted">Dispatch by ZIP:</span>
        <input class="zip" placeholder="63130" value="${esc(r.zip || (r.address && r.address.zip) || '')}" size="6">
        <button class="sec zlook">Search saved</button>
        <button class="zlive">Search open data</button>
        <span class="dispatch-hit result"></span>
      </div>
      <div class="cands"></div>
      <div class="zipbar">
        <input class="dnum" placeholder="dispatch number" value="${esc(r.dispatch_number||'')}">
        <input class="lnote" placeholder="location note (typed from Find My)" value="${esc(r.location_note||'')}" style="flex:1">
        <button class="save">Save</button>
        ${r.status==='handled' ? '<span class="muted">handled</span>' : '<button class="done">Mark handled</button>'}
      </div>
    </div>`;
  }).join("") + '</div>';

  el.querySelectorAll(".req").forEach(node => {
    const id = node.dataset.id;
    // auto-load open-data dispatch numbers when a ZIP is known (once per request, cached)
    const zipVal = node.querySelector(".zip").value.trim();
    window.__disp = window.__disp || {};
    if (zipVal) {
      if (window.__disp[id]) { renderCands(node, window.__disp[id], zipVal); }
      else if (window.__disp[id] !== null) {
        window.__disp[id] = null; // in-flight guard
        api("/api/dispatch?live=1&zip=" + encodeURIComponent(zipVal)).then(d => { window.__disp[id] = (d.live && d.live.candidates) || []; renderCands(node, window.__disp[id], zipVal); }).catch(()=>{ window.__disp[id] = undefined; });
      }
    }
    const showCands = (list, zip) => {
      const box = node.querySelector(".cands");
      if (!list || !list.length) { box.innerHTML = '<div class="muted">No police numbers found in open data near ' + esc(zip) + '. Call 911.</div>'; return; }
      box.innerHTML = list.map(c => `<div class="row"><span><b>${esc(c.agency)}</b> &middot; <b>${esc(c.phone)}</b> <span class="muted">${esc(c.address||'')} &middot; ${c.distanceKm.toFixed(1)} km &middot; ${esc(c.source)}</span></span><button class="usec sec" data-ph="${esc(c.phone)}" data-ag="${esc(c.agency)}">use</button></div>`).join("");
      box.querySelectorAll(".usec").forEach(b => b.onclick = async () => {
        node.querySelector(".dnum").value = b.dataset.ph;
        await api("/api/dispatch", { zip, agency: b.dataset.ag, phone: b.dataset.ph }).catch(()=>{});
      });
    };
    node.querySelector(".zlook").onclick = async () => {
      const zip = node.querySelector(".zip").value.trim();
      const res = node.querySelector(".result");
      try { const d = await api("/api/dispatch?zip=" + encodeURIComponent(zip));
        if (d.match) { res.innerHTML = esc(d.match.phone) + ' <span class="muted">' + esc(d.match.agency) + '</span>'; node.querySelector(".dnum").value = d.match.phone; }
        else res.innerHTML = '<span class="muted">no saved entry - try Search open data</span>';
      } catch(e){ res.textContent = e.message; }
    };
    node.querySelector(".zlive").onclick = async (e) => {
      const zip = node.querySelector(".zip").value.trim(); if (!zip) return;
      e.target.textContent = "searching..."; e.target.disabled = true;
      try { const d = await api("/api/dispatch?live=1&zip=" + encodeURIComponent(zip)); window.__disp[id] = (d.live && d.live.candidates) || []; renderCands(node, window.__disp[id], zip); }
      catch(err){ node.querySelector(".result").textContent = err.message; }
      finally { e.target.textContent = "Search open data"; e.target.disabled = false; }
    };
    node.querySelector(".save").onclick = () => api("/api/help/" + id, { zip: node.querySelector(".zip").value.trim(), dispatch_number: node.querySelector(".dnum").value.trim(), location_note: node.querySelector(".lnote").value.trim() }).then(render);
    const doneBtn = node.querySelector(".done");
    if (doneBtn) doneBtn.onclick = () => api("/api/help/" + id, { status: "handled", zip: node.querySelector(".zip").value.trim(), dispatch_number: node.querySelector(".dnum").value.trim(), location_note: node.querySelector(".lnote").value.trim() }).then(render);
    node.querySelector(".rescan").onclick = async (e) => { e.preventDefault(); e.target.textContent="scanning..."; await api("/api/findmy/refresh").catch(()=>{}); render(); };
    node.querySelector(".opsend").onclick = async () => {
      const inp = node.querySelector(".opmsg"); const t = inp.value.trim(); if (!t) return;
      const btn = node.querySelector(".opsend"); btn.disabled = true; btn.textContent = "…";
      try { await api("/api/send", { to: node.dataset.phone, text: t }); inp.value = ""; render(); }
      catch (e) { alert("Send failed: " + e.message); }
      finally { btn.disabled = false; btn.textContent = "Send"; }
    };
    node.querySelector(".fmset").onclick = async () => {
      const phone = node.dataset.phone;
      await api("/api/people/" + encodeURIComponent(phone), { findmy_name: node.querySelector(".fmname").value.trim() });
      render();
    };
  });
}

async function renderPeople() {
  const d = await api("/api/people");
  $("view-people").innerHTML = '<div class="card"><h2>Registered victims (' + d.people.length + ')</h2>' +
    (d.people.length ? d.people.map(p => `<div class="row"><span><b>${esc(p.name||"(no name)")}</b> ${esc(p.phone)} ${p.intake_done?'':'<span class="muted">intake in progress</span>'}<br><span class="muted">${esc([p.medical,p.allergies&&"allergies: "+p.allergies,p.medications].filter(Boolean).join(" · "))}</span></span>
      <span><input class="fm" placeholder="Find My name" value="${esc(p.findmy_name||'')}" data-ph="${esc(p.phone)}" size="14"><button class="sec fmsave" data-ph="${esc(p.phone)}">set</button></span></div>`).join("") : '<div class="empty">No victims registered yet. When a new number texts, registration starts automatically.</div>') + '</div>';
  $("view-people").querySelectorAll(".fmsave").forEach(b => b.onclick = () => {
    const inp = $("view-people").querySelector('.fm[data-ph="'+b.dataset.ph.replace(/"/g,'')+'"]');
    api("/api/people/" + encodeURIComponent(b.dataset.ph), { findmy_name: inp.value.trim() }).then(render);
  });
}

async function renderDispatch() {
  const d = await api("/api/dispatch");
  $("view-dispatch").innerHTML = '<div class="card"><h2>Dispatch numbers by ZIP</h2>' +
    d.all.map(x => `<div class="row"><span><b>${esc(x.zip)}</b> ${esc(x.agency)} &middot; <b>${esc(x.phone)}</b>${x.notes?`<br><span class="muted">${esc(x.notes)}</span>`:""}</span><a href="#" class="ddel" data-zip="${esc(x.zip)}" style="color:var(--crimson)">delete</a></div>`).join("") +
    `<div class="row"><input class="nzip" placeholder="ZIP" size="6"><input class="nag" placeholder="Agency" style="flex:1"><input class="nph" placeholder="Number" size="14"><button class="dadd">Add</button></div></div>`;
  $("view-dispatch").querySelector(".dadd").onclick = () => {
    const v = $("view-dispatch");
    api("/api/dispatch", { zip: v.querySelector(".nzip").value.trim(), agency: v.querySelector(".nag").value.trim(), phone: v.querySelector(".nph").value.trim() }).then(render).catch(e=>alert(e.message));
  };
  $("view-dispatch").querySelectorAll(".ddel").forEach(a => a.onclick = (e) => { e.preventDefault(); api("/api/dispatch/delete", { zip: a.dataset.zip }).then(render); });
}

async function renderFeed() {
  const d = await api("/api/feed");
  const dir = (m) => m.direction === "in" ? '<span style="color:var(--crimson)">&#9654; in </span>' : '<span style="color:var(--ok)">&#9664; out</span>';
  $("view-feed").innerHTML = '<div class="card"><h2>Live message feed (newest first)</h2>' +
    (d.messages.length ? d.messages.map(m => `<div class="row"><span>${dir(m)} <b>${esc(m.name || m.phone)}</b> <span class="muted">${esc(m.phone)}</span><br>${esc(m.text)}</span><span class="muted">${new Date(m.at).toLocaleTimeString()}<br>${esc(m.kind)}</span></div>`).join("") : '<div class="empty">No messages yet. Texts you receive appear here as they arrive.</div>') + '</div>';
}
function render() { if (tab==="feed") renderFeed(); else if (tab==="help") renderHelp(); else if (tab==="people") renderPeople(); else renderDispatch(); }
status(); render(); setInterval(() => { status(); render(); }, 5000);
</script>
</body>
</html>
