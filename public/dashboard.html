<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Dashboard</title>
<style>
  :root { --crimson:#B11226; --ember:#E2401B; --ink:#171717; --muted:#6B6B6B; --line:#E6E3E1; }
  body { margin:0; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  .mark { width:32px; height:32px; background:var(--crimson); color:#fff; font-weight:700; display:grid; place-items:center; }
  main { padding:24px; max-width:1200px; margin:0 auto; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; background:var(--ink); color:#fff; padding:8px 10px; font-weight:600; }
  td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td { border-bottom:2px solid var(--crimson); }
  .pill { display:inline-block; padding:2px 8px; font-size:12px; font-weight:600; color:#fff; background:var(--muted); }
  .pill.completed { background:var(--crimson); } .pill.calling { background:var(--ember); } .pill.failed, .pill.no-answer { background:var(--ink); }
  input { font-size:15px; padding:8px; border:1px solid var(--line); border-bottom:2px solid var(--ink); width:320px; }
  button { padding:9px 14px; font-weight:600; color:#fff; background:var(--crimson); border:0; cursor:pointer; }
  .muted { color:var(--muted); } a { color:var(--crimson); }
  #err { color:var(--ember); font-weight:600; }
</style>
</head>
<body>
<header><div class="mark">R</div><strong>Relay dashboard</strong><span class="muted" id="updated" style="margin-left:auto"></span></header>
<main>
  <section id="auth"><label>Admin token <input id="token" type="password"></label> <button id="go">Open</button> <span id="err"></span></section>
  <section id="data" hidden>
    <h2>Messages relayed</h2>
    <table><thead><tr><th>Received</th><th>From</th><th>Text</th><th>Call</th><th>Location at time of text</th></tr></thead><tbody id="messages"></tbody></table>
    <h2>Signed-in users, last known location</h2>
    <table><thead><tr><th>Phone</th><th>Last seen</th><th>Accuracy</th><th>Map</th></tr></thead><tbody id="users"></tbody></table>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ago = (t, now) => { const m = Math.round((now - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago"; };
  const maps = (lat, lng) => `<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${lat},${lng}">${lat.toFixed(5)}, ${lng.toFixed(5)}</a>`;
  let token = (() => { try { return localStorage.getItem("relay.admin"); } catch { return null; } })();
  let timer = null;
  async function refresh() {
    const res = await fetch("/api/admin/overview", { headers: { Authorization: "Bearer " + token } });
    if (!res.ok) { $("err").textContent = res.status === 401 ? "Bad token" : "HTTP " + res.status; $("auth").hidden = false; $("data").hidden = true; clearInterval(timer); return; }
    const d = await res.json();
    $("auth").hidden = true; $("data").hidden = false; $("err").textContent = "";
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
    $("messages").innerHTML = d.messages.map((m) => `<tr>
      <td>${new Date(m.received_at).toLocaleString()}<br><span class="muted">${ago(m.received_at, d.now)}</span></td>
      <td>${esc(m.sender)}</td><td>${esc(m.text)}</td>
      <td><span class="pill ${esc(m.status)}">${esc(m.status)}</span>${m.error ? `<br><span class="muted">${esc(m.error)}</span>` : ""}</td>
      <td>${m.lat != null ? maps(m.lat, m.lng) + `<br><span class="muted">${esc(m.address || "")} (${ago(m.location_at, d.now)})</span>` : '<span class="muted">unknown, not signed in to the app</span>'}</td>
    </tr>`).join("") || '<tr><td colspan="5" class="muted">No messages yet</td></tr>';
    $("users").innerHTML = d.users.map((u) => `<tr><td>${esc(u.phone)}</td><td>${ago(u.recorded_at, d.now)}</td><td>${u.accuracy != null ? Math.round(u.accuracy) + " m" : "-"}</td><td>${maps(u.lat, u.lng)}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">Nobody signed in yet</td></tr>';
  }
  $("go").onclick = () => { token = $("token").value.trim(); try { localStorage.setItem("relay.admin", token); } catch {} refresh(); timer = setInterval(refresh, 5000); };
  if (token) { refresh(); timer = setInterval(refresh, 5000); }
})();
</script>
</body>
</html>
