name: RelayTracker
options:
  bundleIdPrefix: com.cadenwarren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "U46R6L69U8"
    CODE_SIGN_STYLE: Automatic
targets:
  RelayTracker:
    type: application
    platform: iOS
    sources:
      - path: RelayTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadenwarren.relaytracker
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: RelayTracker/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: RelayTracker/Info.plist
      properties:
        CFBundleDisplayName: Relay
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Relay shares your location so someone you are expecting a call from can be told where you are."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Relay shares your location in the background so your last known position is available even when the app is not open."
        UIBackgroundModes:
          - location
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
